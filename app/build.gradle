plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.perevod.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.perevod.app'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
        // репозиторий, из релизов которого приложение обновляется
        resValue "string", "update_repo", (System.getenv('GITHUB_REPOSITORY') ?: 'ricloned/perevodchik')
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'perevod123'
            keyAlias 'perevod'
            keyPassword 'perevod123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // офлайн-перевод на устройстве и офлайн-определение языка
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    // распознавание текста на фото (модели ставятся через сервисы Google, APK остаётся лёгким)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1'
    implementation 'androidx.core:core:1.13.1'
}
